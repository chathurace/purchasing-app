# Copy to config.yaml and fill in real values. config.yaml is gitignored.
server:
  port: 8081

database:
  url: "postgres://chathura@localhost:5432/purchasing?sslmode=disable"

oidc:
  # WSO2 Identity Server. `issuer` must equal the "issuer" claim in issued
  # tokens (for the default tenant: https://localhost:9443/oauth2/token).
  # The server appends /.well-known/openid-configuration to fetch discovery, so
  # leave discovery_url blank unless the IdP hosts discovery under a different
  # base than the issuer claim (the well-known suffix is stripped if included).
  issuer: "https://localhost:9443/oauth2/token"
  discovery_url: ""
  client_id: "<wso2-client-id>"
  insecure_skip_verify: true   # dev only — trusts the self-signed WSO2 cert

# Backend-issued browser session — the app's own session cookie, independent of
# the IdP's token lifetimes (see docs/sessions.md). The SPA signs in through the
# IdP once and exchanges that token for an HttpOnly cookie that survives token
# expiry and browser restarts, which is what stops the roughly-daily sign-outs.
# The whole block is optional: omitting it gives 60-day Secure/Lax cookies.
session:
  enabled: true
  ttl_days: 60                 # idle lifetime — every request slides it forward
  # Dev over http://localhost: Safari (and older Firefox) refuse to store a
  # Secure cookie on a plain-HTTP page. Set true for any real deployment.
  cookie_secure: false
  # "lax" when the API is same-site with the SPA (localhost:5173 → :8081, or a
  # proxied /api). Use "none" only for a genuinely cross-site API, which also
  # needs cookie_secure: true, the gateway to allow credentials, and
  # `apiAllowCredentials: true` in the webapp's config.js.
  cookie_samesite: "lax"

# User directory (SCIM2) — powers name/email autocomplete from the connected
# identity server. Needs a machine-to-machine (client-credentials) app in WSO2 IS
# / Asgardeo holding the `internal_user_mgt_list` scope. When enabled is false
# (the default), autocomplete falls back to the app's own DB users, so dev runs
# without an M2M app. The full directory is fetched once per cache_ttl_seconds and
# served from an in-memory cache; the browser never sees these credentials.
scim:
  enabled: false
  base_url: "https://localhost:9443/scim2"       # SCIM2 base
  token_url: "https://localhost:9443/oauth2/token"
  client_id: "<scim-m2m-client-id>"
  client_secret: "<scim-m2m-client-secret>"
  scopes:
    - "internal_user_mgt_list"
  insecure_skip_verify: true   # dev only — trusts the self-signed WSO2 cert
  cache_ttl_seconds: 600       # directory refresh interval
  page_size: 100               # SCIM pagination count

# Claude-backed quotation PDF extraction — reads vendor / currency / total /
# validity / line items out of an uploaded quotation PDF and offers them as
# editable suggestions on the PR page (nothing is saved without a procurement user
# confirming). When enabled is false (the default), the endpoints report
# unavailable and the UI hides the feature, so dev needs no API key. The key is
# used server-side only and is never sent to the browser.
# See docs/quotation-extraction.md.
anthropic:
  enabled: false
  api_key: "<anthropic-api-key>"
  model: "claude-opus-5"
  max_pdf_bytes: 20971520      # 20MB; the API caps a request at 32MB
  timeout_seconds: 180         # per-extraction cap

storage:
  backend: "local"             # "local" (filesystem) or "gdrive" (Google Drive)
  files_root: "../files"       # local backend only; relative to the backend working dir

  # Google Drive backend (files under base_folder_id, one subfolder per PR).
  # See docs/file-storage.md. Set backend: "gdrive" and one of the blocks below.
  #
  # gdrive:
  #   # --- OAuth (recommended) — acts as a real user, fine-grained drive.file scope.
  #   # Put only the static GCP artifacts here; an admin then connects the account
  #   # and picks the folder from the app UI (Settings → File storage). Requires
  #   # security.secret_key below.
  #   auth: "oauth"
  #   oauth:
  #     client_id: "<oauth-web-client-id>"
  #     client_secret: "<oauth-web-client-secret>"
  #     api_key: "<google-api-key>"          # Picker developer key
  #     app_id: ""                           # optional; default = client_id prefix (project number)
  #     # Optional CLI/headless bootstrap (skip if configuring from the UI):
  #     #   base_folder_id: "<drive-folder-id>"   # from `go run ./cmd/gdrive-grant`
  #     #   refresh_token: "<refresh-token>"      # from `go run ./cmd/gdrive-auth`
  #
  #   # --- Service account — app acts as itself. Needs a Shared Drive (plain
  #   # service accounts have no personal quota). No in-app configuration.
  #   # auth: "service_account"
  #   # credentials_file: "./gdrive-sa.json"      # JSON key (gitignore it)
  #   # base_folder_id: "<shared-drive-folder-id>"

# Encrypts secrets at rest (the Drive refresh token saved via the in-app storage
# settings). Required only when an admin connects Drive from the UI. Generate with:
#   head -c 32 /dev/urandom | base64
security:
  secret_key: ""

bootstrap_admin:
  email: "chathura@wso2.com"

cors:
  allowed_origins:
    - "http://localhost:5173"

# Optional. When enabled is false (the default), approval-request notifications
# are written to the log instead of emailed, so dev needs no SMTP server.
email:
  enabled: false
  smtp_host: ""
  smtp_port: 587
  username: ""
  password: ""
  from_address: "purchasing@wso2.com"
  app_base_url: ""           # frontend origin for links; defaults to first CORS origin
