server {
    listen 8080;

    root /usr/share/nginx/html;
    index index.html;

    # Security headers (sent on all responses, including errors via `always`).
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    # Content CSP. This file only governs the deployed nginx container — local
    # `npm run dev` (Vite) is unaffected — so the origins are well-defined: the
    # SPA's own origin, Asgardeo (OIDC discovery/token/jwks/userinfo + the
    # silent-renew iframe), and the Choreo-hosted backend API. index.html loads
    # only external scripts (config.js + the module bundle, no inline
    # <script>/handlers), so script-src 'self' is safe; 'unsafe-inline' is
    # needed for styles only (React inline style props + Tailwind). No external
    # images/fonts/CDNs are used.
    #
    # POST-DEPLOY: verify a full login + page navigation produces no CSP
    # violations in the browser console. If the backend moves off
    # *.choreoapis.dev (e.g. a custom domain), add that origin to connect-src.
    # To verify before enforcing, rename this header to
    # `Content-Security-Policy-Report-Only` first, then flip back.
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' https://api.asgardeo.io https://*.choreoapis.dev; frame-src 'self' https://api.asgardeo.io; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;

    # Disable browser features the app doesn't use.
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=(), usb=(), accelerometer=(), gyroscope=(), magnetometer=()" always;

    # SPA fallback: serve index.html for all routes so React Router handles them.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
