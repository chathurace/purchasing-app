# WHETHER THIS FILE IS LIVE DEPENDS ON HOW THE COMPONENT IS BUILT.
#
# It takes effect only when the web app is built from ../Dockerfile, which copies
# it to /etc/nginx/conf.d/. Under Choreo's static-web-app buildpack it is just
# another file inside dist/ and nothing reads it — so none of the headers below
# were served and the /api proxy did not exist. Switching the Choreo component to
# the Dockerfile build is what makes both the hardening and first-party session
# cookies real; see docs/deployment-guide.md → "Frontend — Choreo web app".
#
# Local `npm run dev` (Vite) never reads this file.
server {
    listen 8080;

    root /usr/share/nginx/html;
    index index.html;

    # ── API reverse proxy (first-party session cookies) ─────────────────────
    #
    # Serving the API from the SPA's own origin is what lets the backend session
    # cookie be a first-party, SameSite=Lax cookie (docs/sessions.md). Pointed
    # straight at the Choreo backend URL the cookie would instead be cross-site,
    # which Safari blocks outright and other browsers only tolerate when it is
    # Partitioned — and which additionally needs the API gateway to return
    # Access-Control-Allow-Credentials.
    #
    # With this in place set apiBaseUrl to '' (same origin) in config.js and
    # session.cookie_samesite to "lax" in the backend config.
    #
    # The backend base URL is per environment: substitute it at image build time
    # or edit it here. Assigning it to a variable (rather than inlining it in
    # proxy_pass) makes nginx resolve it at request time via the resolver below,
    # so a DNS change does not need a container restart.
    resolver 8.8.8.8 1.1.1.1 valid=300s ipv6=off;
    location /api/ {
        set $backend "https://11737422-7078-8510-1074-820892631194-az-stg.prod.wdt.choreoapis.dev/llkq/purchasing-test-backend/v1.0";
        proxy_pass $backend$request_uri;

        proxy_http_version 1.1;
        proxy_ssl_server_name on;              # SNI — Choreo terminates TLS per host
        proxy_set_header Host $proxy_host;     # not $host: the upstream routes on its own name
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Origin is passed through unchanged: the backend's CSRF check compares it
        # against cors.allowed_origins, so rewriting it would defeat the check.

        # Document uploads (quotation / contract / invoice PDFs) go through this
        # proxy, and the backend accepts up to anthropic.max_pdf_bytes (20MB).
        # nginx's 1MB default would 413 them before the backend ever saw them.
        client_max_body_size 32m;

        # Quotation PDF extraction calls Claude server-side with a 180s cap
        # (anthropic.timeout_seconds), so the proxy must outwait it.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;                   # stream file downloads straight through
        proxy_cache off;
    }

    # Security headers (sent on all responses, including errors via `always`).
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    # Content CSP. This file only governs the deployed nginx container, so the
    # origins are well-defined. index.html loads only external scripts (config.js
    # + the module bundle, no inline <script>/handlers), so script-src 'self' is
    # safe; 'unsafe-inline' is needed for styles only (MUI/emotion inject style
    # elements at runtime). Each third-party origin below is here for one reason:
    #
    #   fonts.googleapis.com / fonts.gstatic.com  the Space Grotesk / Inter /
    #       IBM Plex Mono stylesheet + font files linked from index.html
    #   api.asgardeo.io                           OIDC discovery/token/jwks/userinfo
    #   *.choreoapis.dev                          kept alongside 'self' so the
    #       policy covers both deployments: proxied (same-origin /api) and direct
    #   apis.google.com / accounts.google.com / docs.google.com / *.gstatic.com /
    #   *.googleusercontent.com / *.googleapis.com
    #       Settings → File storage: the Google Identity Services client and the
    #       Drive Picker (an iframe served from docs.google.com, with its own
    #       scripts, styles, icons and XHRs). Admin-only, but a blocked script
    #       there fails silently, so these must be allowed explicitly.
    #
    # POST-DEPLOY: verify a full login, a page navigation, a document upload AND
    # the Settings → File storage "Connect Google account / Choose folder" flow
    # produce no CSP violations in the browser console. To verify before
    # enforcing, rename the header to `Content-Security-Policy-Report-Only`
    # first, then flip it back.
    add_header Content-Security-Policy "default-src 'none'; script-src 'self' https://apis.google.com https://accounts.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://www.gstatic.com; img-src 'self' data: https://*.googleusercontent.com https://*.gstatic.com; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https://api.asgardeo.io https://*.choreoapis.dev https://accounts.google.com https://*.googleapis.com; frame-src 'self' https://api.asgardeo.io https://accounts.google.com https://docs.google.com https://content.googleapis.com; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;

    # Disable browser features the app doesn't use.
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=(), usb=(), accelerometer=(), gyroscope=(), magnetometer=()" always;

    # SPA fallback: serve index.html for all routes so React Router handles them.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
